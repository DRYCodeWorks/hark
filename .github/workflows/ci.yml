name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # hark only runs on macOS, but the suite is portable and Linux is the
    # faster signal. Both are here because the scripted checks are shell, and
    # GNU and BSD awk/grep are exactly where a passing test stops meaning
    # anything on the machine a user actually installs to.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version: astral-sh/setup-uv publishes no floating
      # major tag, so @v9 does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --locked fails if uv.lock has drifted from pyproject.toml, so a
      # dependency change can't land without the lockfile that pins it.
      - name: pytest
        run: uv run --locked pytest -q

      - name: Install Lua
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install lua
          else
            sudo apt-get update && sudo apt-get install -y lua5.4
            sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
          fi

      # The client-side suite. It has never been wired into anything, so it
      # only ran when someone remembered it existed.
      - name: Lua client tests
        run: lua tests/test_client_record.lua

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Preinstalled on the Ubuntu runner image.
      - name: shellcheck
        run: |
          shellcheck install-server.sh install-client.sh install-agent.sh \
                     client/agent/build-agent.sh

  # The agent is macOS-only and needs a real Swift toolchain, so this cannot
  # join the portable matrix above. It builds the bundle and asserts the
  # signature verifies - an unsigned or broken-signature bundle is exactly the
  # state in which TCC grants stop surviving a rebuild.
  agent:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build hark.app
        run: ./client/agent/build-agent.sh

      - name: Verify the bundle signature
        run: codesign --verify --strict --verbose=2 build/hark.app

      - name: Verify the bundled recorder is present and signed
        run: |
          test -x build/hark.app/Contents/MacOS/rec
          codesign --verify --strict build/hark.app/Contents/MacOS/rec
